name: Bump DBine cask

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Casks/dbine.rb to the latest DBine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/dbine.rb

          tag=$(gh api repos/addlayer-io/dbine/releases/latest --jq .tag_name)
          latest=${tag#v}
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag '$tag'"
            exit 1
          fi
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")
          echo "Cask: $current, latest release: $latest"

          if [ "$latest" = "$current" ]; then
            echo "Up to date."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" != "$latest" ]; then
            echo "Latest release is older than the cask; nothing to do."
            exit 0
          fi

          arm="DBine_${latest}_aarch64.dmg"
          intel="DBine_${latest}_x64.dmg"
          assets=$(gh api "repos/addlayer-io/dbine/releases/tags/$tag" --jq '.assets[].name')
          for f in "$arm" "$intel"; do
            if ! grep -qxF "$f" <<<"$assets"; then
              echo "::notice::$f is not uploaded yet; trying again on the next run."
              exit 0
            fi
          done

          dl=$(mktemp -d)
          gh release download "$tag" -R addlayer-io/dbine -D "$dl" -p "$arm" -p "$intel"
          arm_sha=$(sha256sum "$dl/$arm" | cut -d' ' -f1)
          intel_sha=$(sha256sum "$dl/$intel" | cut -d' ' -f1)

          sed -i \
            -e "s/^  version \".*\"$/  version \"$latest\"/" \
            -e "s/^  sha256 arm:   \"[0-9a-f]\{64\}\",$/  sha256 arm:   \"$arm_sha\",/" \
            -e "s/^         intel: \"[0-9a-f]\{64\}\"$/         intel: \"$intel_sha\"/" \
            "$cask"

          grep -qF "version \"$latest\"" "$cask"
          grep -qF "arm:   \"$arm_sha\"" "$cask"
          grep -qF "intel: \"$intel_sha\"" "$cask"
          git diff

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$cask"
          git commit -m "dbine $latest"
          git push
